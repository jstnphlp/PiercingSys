<!doctype html>

<head>

  <style>
    *,*::before,*::after{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#5b3a2f;color:#3b2923;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.font-display,h1,h2,.section-title,.summary-title{font-family:Georgia,"Times New Roman",serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.backdrop{min-height:100vh;display:grid;place-items:center;padding:18px;background:#2d1812a6;backdrop-filter:blur(4px)}.dialog{width:min(1088px,calc(100vw - 36px));max-height:min(900px,94vh);overflow:hidden;border:2px solid #3b2923;border-radius:22px;background:#fff5df;box-shadow:8px 8px 0 #3b2923;display:flex;flex-direction:column}.dialog>header{flex:0 0 auto;display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed #c88f6e;background:#fff5df;padding:16px 21px}.dialog h1{margin:0;font-size:23px;line-height:1.05}.dialog header p{margin:5px 0 0;color:#785d53;font-size:11px}.close{width:34px;height:34px;border:1.5px solid #3b2923;border-radius:10px;background:#efc6a4}.composer{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 312px;align-items:stretch;overflow:hidden}.main{min-width:0;padding:15px 17px 14px;display:flex;flex-direction:column;gap:11px;background:#fff5df}.summary-side{min-width:0;background:#f6dcae;border-left:1px dashed #bb7f5d;padding:14px;display:flex;align-items:stretch}.summary-card{min-height:0;flex:1;display:flex;flex-direction:column;overflow:hidden;border:2px solid #3b2923;border-radius:18px 13px 19px 14px;background:#fff8e8;box-shadow:4px 4px 0 #3b2923}.summary-card header{flex:0 0 auto;border-bottom:1px dashed #c98965;background:#fff1cf;padding:12px 13px}.summary-title{display:block;font-size:18px;font-weight:760}.summary-card small{font-size:10px;color:#765c52}.summary-details{min-height:0;overflow:auto;margin:0;display:grid;gap:8px;padding:12px 13px;font-size:10.5px;scrollbar-width:thin;scrollbar-color:#d5aa89 transparent}.row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px}.row dt{margin:0;color:#a34d30;font-size:8px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}.row dd{margin:0;line-height:1.35}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border:1.5px solid #3b2923;border-radius:10px 8px 11px 9px;background:#f0c66e;padding:4px 7px;font-size:9px;font-weight:900;box-shadow:1px 1px 0 #3b2923}.readiness{flex:0 0 auto;margin:0 13px 10px;border:1.5px solid #3b2923;border-radius:14px 10px 15px 11px;background:#fff5df;padding:10px;font-size:10px;line-height:1.45}.readiness.ready{background:#d8e5cf;color:#315342}.readiness strong{font-size:12px}.actions{margin-top:auto;flex:0 0 auto;display:flex;justify-content:flex-end;gap:9px;border-top:1px dashed #c98965;background:#fff1cf;padding:12px 13px}.section{min-width:0}.section+.section{border-top:1px dashed #c88f6e;padding-top:10px}.section-head{margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}.section-title{display:flex;align-items:center;gap:7px;color:#a34d30;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.num{display:grid;place-items:center;width:23px;height:23px;border:1.5px solid #3b2923;border-radius:50% 43% 54% 45%;background:#efb83f;color:#59351c;box-shadow:1px 1px 0 #3b2923}.meta{border:1px solid #3b2923;border-radius:999px;background:#d8e4c7;padding:5px 9px;color:#315342;font-size:8px;font-weight:900;white-space:nowrap;box-shadow:1px 1px 0 #3b2923}.search{position:relative}.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9a6b55}.input,.select,.textarea{width:100%;min-height:39px;border:1.5px solid #3b2923;border-radius:10px 7px 11px 8px;background:#fffaf0;padding:8px 10px;color:#3b2923;box-shadow:2px 2px 0 #d9a47e}.search .input{padding-left:34px}.label{display:flex;flex-direction:column;gap:5px;color:#694d43;font-size:11px;font-weight:800}.service-box{margin-top:7px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:210px;overflow:auto;border:1.5px solid #3b2923;border-radius:14px;background:#fae5bf;padding:8px;scrollbar-width:thin;scrollbar-color:#d5aa89 transparent}.service{min-width:0;min-height:50px;display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:7px;border:1.5px solid #bc7c57;border-radius:12px 9px 13px 10px;background:#fff8e8;padding:7px;font-size:9.5px;transition:.14s}.service.selected{transform:translate(-1px,-1px);border:2px solid #3b2923;background:#f0c66e;box-shadow:3px 3px 0 #3b2923}.box{display:grid;place-items:center;width:18px;height:18px;border:2px solid #3b2923;border-radius:6px 4px 7px 5px;background:#fff;color:transparent}.selected .box{background:#df682c;color:#fff}.service strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.service small{display:block;margin-top:3px;color:#81665c;font-size:8px;line-height:1.15}.minutes{border:1px dashed #9f6a4d;border-radius:999px;background:#fff5df;padding:4px 6px;font-size:8px;font-weight:900;white-space:nowrap}.paired{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.seg{margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #3b2923;border-radius:12px;background:#d9ac83;padding:3px;box-shadow:1px 2px 0 #3b2923}.seg button{border:0;border-radius:8px;background:transparent;padding:8px;font-size:11px;font-weight:900}.seg .active{background:#fff4d7;color:#b74827;box-shadow:1px 1px 0 #3b2923}.client-grid,.schedule-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.existing-fields{display:grid;gap:8px}.duration-note{margin:8px 0 0;display:flex;gap:7px;align-items:center;border:1px dashed #ba7652;border-radius:11px;background:#f8dcae;padding:8px 10px;color:#60463c;font-size:10.5px}.notes-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}.textarea{min-height:46px;max-height:92px;resize:vertical}.checkline{display:flex;align-items:center;gap:8px;min-height:40px;padding:8px 10px;color:#71594f;font-size:9.5px}.checkline input{position:absolute;opacity:0}.fake-check{display:grid;place-items:center;width:18px;height:18px;border:2px solid #3b2923;border-radius:5px;background:#fff;color:transparent}.checkline input:checked+.fake-check{background:#df682c;color:#fff}.btn{min-height:39px;border:2px solid #3b2923;border-radius:13px 10px 14px 11px;padding:0 16px;font-size:12px;font-weight:800;box-shadow:3px 3px 0 #3b2923}.btn.secondary{background:#fffaf0;color:#3b2923}.btn.primary{background:#df682c;color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}.inspector{position:fixed;right:12px;bottom:12px;z-index:3;max-width:360px;border:1.5px solid #3b2923;border-radius:14px;background:#fff8e8;padding:10px;font-size:10px;box-shadow:3px 3px 0 #3b2923}.inspector strong{display:block;margin-bottom:5px}.pass{color:#315342}.fail{color:#8f321d}.hidden{display:none!important}@media (max-width:1120px){.dialog{width:calc(100vw - 28px)}.composer{grid-template-columns:minmax(0,1fr) 292px}.service-box{grid-template-columns:repeat(2,minmax(0,1fr));max-height:180px}.main{padding:13px;gap:9px}.paired{gap:10px}.summary-side{padding:12px}.input,.select{min-height:37px}.dialog>header{padding:13px 18px}.duration-note{padding:7px 9px}}@media (max-width:860px){.backdrop{display:block;min-height:100vh;padding:12px;overflow:auto}.dialog{width:100%;max-height:none;overflow:visible}.composer{display:block;overflow:visible}.main{display:block}.section{margin-bottom:14px}.paired,.client-grid,.schedule-grid,.notes-row{grid-template-columns:1fr}.service-box{grid-template-columns:1fr;max-height:260px}.summary-side{border-left:0;border-top:1px dashed #bb7f5d}.summary-card{min-height:360px}.inspector{display:none}}@media (max-height:740px) and (min-width:861px){.dialog>header{padding-top:11px;padding-bottom:11px}.main{padding-top:10px;padding-bottom:10px;gap:8px}.section+.section{padding-top:8px}.section-head{margin-bottom:5px}.service-box{max-height:166px}.input,.select{min-height:35px;padding-top:7px;padding-bottom:7px}.textarea{min-height:39px}.btn{min-height:36px}.summary-card header,.actions{padding-top:10px;padding-bottom:10px}.summary-details{gap:6px;padding-top:10px;padding-bottom:10px}.readiness{padding:8px;margin-bottom:8px}.duration-note{margin-top:6px;padding-top:6px;padding-bottom:6px}}
  </style>
</head>
<body>
  <main class="backdrop">
    <section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
      <header>
        <div><h1 id="title">New appointment</h1><p>Studio-created bookings ignore public lead time and horizon limits.</p></div>
        <button class="close" aria-label="Close dialog">×</button>
      </header>
      <form class="composer" id="form">
        <div class="main" id="mainPane">
          <section class="section">
            <div class="section-head"><span class="section-title"><span class="num">1</span>Services</span><span class="meta" id="serviceMeta">0 selected · 0 min</span></div>
            <label class="search"><span>⌕</span><input class="input" id="serviceSearch" type="search" placeholder="Search services" aria-label="Search services"></label>
            <div class="service-box" id="serviceBox" role="group" aria-label="Services"></div>
          </section>
          <div class="paired">
            <section class="section">
              <div class="section-head"><span class="section-title"><span class="num">2</span>Client</span></div>
              <div class="seg"><button type="button" id="existingBtn" class="active">Existing client</button><button type="button" id="newBtn">New client</button></div>
              <div id="existingFields" class="existing-fields">
                <label class="label">Search clients<input class="input" id="clientSearch" type="search" placeholder="Search clients"></label>
                <label class="label">Client<select class="select" id="clientSelect"><option value="">Choose a client</option><option>Maya Santos · maya@example.com</option><option>Rafi Dela Cruz · rafi@example.com</option><option>Juno Reyes · juno@example.com</option></select></label>
              </div>
              <div id="newFields" class="client-grid hidden">
                <label class="label">First name<input class="input" id="firstName" autocomplete="off"></label>
                <label class="label">Last name<input class="input" id="lastName" autocomplete="off"></label>
                <label class="label">Email<input class="input" id="email" type="email" autocomplete="off"></label>
                <label class="label">Phone<input class="input" id="phone" autocomplete="off"></label>
              </div>
            </section>
            <section class="section">
              <div class="section-head"><span class="section-title"><span class="num">3</span>Schedule</span><span class="meta">Asia/Manila</span></div>
              <div class="schedule-grid">
                <label class="label">Eligible piercer<select class="select" id="piercer"><option value="">Choose eligible piercer</option><option>Olive Navarro</option><option>Sam Reyes</option><option>Lia Cruz</option></select></label>
                <label class="label">Station<select class="select" id="station"><option>No station</option><option>Station 1</option><option>Station 2</option><option>Private room</option></select></label>
                <label class="label">Date<input class="input" id="date" type="date" value="2026-09-03"></label>
                <label class="label">Manila time<input class="input" id="time" type="time" value="10:00"></label>
              </div>
              <p class="duration-note">◷ <span>Duration · <strong id="durationInline">0 min</strong><br>End time calculated automatically</span></p>
            </section>
          </div>
          <section class="section">
            <div class="section-head"><span class="section-title"><span class="num">4</span>Notes / additional details</span></div>
            <div class="notes-row">
              <label class="label">Notes<textarea class="textarea" id="notes" maxlength="2000" placeholder="Optional"></textarea></label>
              <label class="checkline"><input id="confirm" type="checkbox" checked><span class="fake-check">✓</span>Email a confirmation to the client</label>
            </div>
          </section>
        </div>
        <aside class="summary-side" id="summarySide">
          <div class="summary-card">
            <header><strong class="summary-title">Appointment Summary</strong><small>Live review before creation</small></header>
            <dl class="summary-details" id="summary"></dl>
            <div class="readiness" id="readiness"></div>
            <footer class="actions"><button type="button" class="btn secondary">Cancel</button><button class="btn primary" id="createBtn" disabled>Create appointment</button></footer>
          </div>
        </aside>
      </form>
    </section>
    <aside class="inspector" id="inspector"><strong>Layout validation</strong><div id="metrics"></div></aside>
  </main>
  <script>
    const services=[["Oral piercing",30,["Olive","Sam"]],["Nipple piercing",45,["Olive"]],["Dermal anchor",40,["Sam","Lia"]],["Genital consultation",60,["Olive"]],["Curation session",30,["Lia"]],["Removal",20,["Sam","Lia"]],["Bump check",15,["Olive","Lia"]],["No-pull disc fitting",15,["Sam"]],["Titanium jewelry change",20,["Lia","Olive"]],["Ultrasonic cleaning",10,["Sam","Lia"]]];
    const state={selected:new Set(),mode:"existing"};
    const $=id=>document.getElementById(id);
    function renderServices(){const q=$("serviceSearch").value.trim().toLowerCase();$("serviceBox").innerHTML="";services.filter(s=>s[0].toLowerCase().includes(q)).forEach((s,i)=>{const label=document.createElement("label");label.className="service"+(state.selected.has(s[0])?" selected":"");label.innerHTML=`<input class="hidden" type="checkbox" ${state.selected.has(s[0])?"checked":""}><span class="box">✓</span><span><strong>${s[0]}</strong><small>${s[2].join(", ")||"No eligible piercer"}</small></span><small class="minutes">${s[1]} min</small>`;label.addEventListener("click",e=>{e.preventDefault();state.selected.has(s[0])?state.selected.delete(s[0]):state.selected.add(s[0]);render()});$("serviceBox").append(label)})}
    function row(k,v){return `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`}
    function value(id){return $(id).value.trim()}
    function clientSummary(){return state.mode==="existing"?value("clientSelect"):`${value("firstName")} ${value("lastName")}`.trim()}
    function missing(){const m=[];if(!state.selected.size)m.push("Services");if(!clientSummary())m.push(state.mode==="existing"?"Client":"New client name");if(state.mode==="new"&&(!value("email")||!value("phone")))m.push("New client contact");if(!value("piercer"))m.push("Piercer");if(!value("date")||!value("time"))m.push("Date and time");return m}
    function renderSummary(){const chosen=[...state.selected];const dur=chosen.reduce((sum,n)=>sum+(services.find(s=>s[0]===n)?.[1]||0),0);$("serviceMeta").textContent=`${chosen.length} selected · ${dur} min`;$("durationInline").textContent=`${dur} min`;const chips=chosen.length?`<span class="chips">${chosen.map(n=>`<span class="chip">${n}</span>`).join("")}</span>`:`<span style="color:#82675d;font-style:italic">Not selected</span>`;$("summary").innerHTML=[row("Services",chips),row("Total duration",dur?`${dur} min`:`<span style="color:#82675d;font-style:italic">Not selected</span>`),row("Client",clientSummary()||`<span style="color:#82675d;font-style:italic">${state.mode==="existing"?"Choose a client":"Enter new client details"}</span>`),row("Piercer",value("piercer")||`<span style="color:#82675d;font-style:italic">Choose a piercer</span>`),row("Station",value("station")||"No station"),row("Date & time",value("date")&&value("time")?`${value("date")} · ${value("time")}`:`<span style="color:#82675d;font-style:italic">Choose date and time</span>`),row("Notes",value("notes")||`<span style="color:#82675d;font-style:italic">No notes</span>`)].join("");const miss=missing();$("readiness").className="readiness"+(miss.length?"":" ready");$("readiness").innerHTML=miss.length?`<strong>Still needed:</strong><ul>${miss.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<strong>Ready to create</strong><p>Server validation still checks qualifications, hours, availability, and conflicts.</p>`;$("createBtn").disabled=!!miss.length}
    function renderMetrics(){const d=$("dialog"),m=$("mainPane"),s=$("summarySide"),b=$("serviceBox");const dialogScroll=d.scrollHeight>d.clientHeight+1;const mainScroll=m.scrollHeight>m.clientHeight+1;const tanReach=Math.abs(s.getBoundingClientRect().bottom-m.getBoundingClientRect().bottom)<2;const actionsVisible=document.querySelector(".actions").getBoundingClientRect().bottom<=innerHeight;const lines=[["dialog no scroll",!dialogScroll],["main no scroll",!mainScroll],["summary reaches bottom",tanReach],["only services may scroll",b.scrollHeight>b.clientHeight&&!dialogScroll&&!mainScroll],["actions visible",actionsVisible],["viewport",`${innerWidth}×${innerHeight}`]];$("metrics").innerHTML=lines.map(([k,v])=>`<div class="${v===true?"pass":v===false?"fail":""}">${k}: ${v===true?"pass":v===false?"fail":v}</div>`).join("")}
    function render(){renderServices();renderSummary();requestAnimationFrame(renderMetrics)}
    $("serviceSearch").addEventListener("input",render);["clientSearch","clientSelect","firstName","lastName","email","phone","piercer","station","date","time","notes","confirm"].forEach(id=>$(id).addEventListener("input",render));$("existingBtn").addEventListener("click",()=>{state.mode="existing";$("existingBtn").classList.add("active");$("newBtn").classList.remove("active");$("existingFields").classList.remove("hidden");$("newFields").classList.add("hidden");render()});$("newBtn").addEventListener("click",()=>{state.mode="new";$("newBtn").classList.add("active");$("existingBtn").classList.remove("active");$("newFields").classList.remove("hidden");$("existingFields").classList.add("hidden");render()});addEventListener("resize",renderMetrics);render();
  </script>
</body>
</html>
